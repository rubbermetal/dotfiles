##### Basic Settings #####

# 256 colors and truecolor support
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",alacritty:RGB"

# Scrollback size
set -g history-limit 10000

# Mouse support
set -g mouse on

# Escape timing
set -s escape-time 0


##### Scrolling + Copy Mode #####

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

setw -g mode-keys vi

bind-key / copy-mode \; send-key ?
bind-key n send -X search-again
bind-key N send -X search-reverse

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux-osc52-copy"

set-option -s set-clipboard on


##### Pane Splits + Movement #####

unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


##### Status Bar (Catppuccin base colors) #####

set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"
set -g status-interval 5

set -g status-left "#[fg=#a6e3a1]#H "
set -g status-right "#[fg=#89b4fa]%Y-%m-%d #[fg=#f5c2e7]%H:%M"

setw -g window-status-current-format "#[bold fg=#f9e2af]#I:#W#[default]"
setw -g window-status-format "#[fg=#585b70]#I:#W#[default]"

##### TPM + Resurrect + Continuum #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Manual save/restore bindings (still available if needed)
bind S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind R run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# Enable automatic restore when tmux starts
set -g @continuum-restore 'on'

# Optional: autosave interval in minutes (default: 15)
# You can change this if you want it more or less frequent
set -g @continuum-save-interval '15'

# Load Catppuccin Mocha theme
source-file ~/.config/tmux/themes/catppuccin_mocha.tmux

# TPM must be the last plugin line
run '~/.tmux/plugins/tpm/tpm'
