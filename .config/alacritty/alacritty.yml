# Alacritty Configuration File
# Ensure this file is at: ~/.config/alacritty/alacritty.yml

window:
  dimensions:
    columns: 120
    lines: 35
  padding:
    x: 10
    y: 10
  dynamic_padding: false
  opacity: 0.95  # Slight transparency

scrolling:
  history: 10000
  multiplier: 3

font:
  normal:
    family: "JetBrainsMono Nerd Font"
    style: Regular
  bold:
    family: "JetBrainsMono Nerd Font"
    style: Bold
  italic:
    family: "JetBrainsMono Nerd Font"
    style: Italic
  size: 12.0
  offset:
    x: 0
    y: 2
  glyph_offset:
    x: 0
    y: 1

draw_bold_text_with_bright_colors: true

colors:
  primary:
    background: '#1e1e2e'
    foreground: '#cdd6f4'
  normal:
    black:   '#45475a'
    red:     '#f38ba8'
    green:   '#a6e3a1'
    yellow:  '#f9e2af'
    blue:    '#89b4fa'
    magenta: '#f5c2e7'
    cyan:    '#94e2d5'
    white:   '#bac2de'
  bright:
    black:   '#585b70'
    red:     '#f38ba8'
    green:   '#a6e3a1'
    yellow:  '#f9e2af'
    blue:    '#89b4fa'
    magenta: '#f5c2e7'
    cyan:    '#94e2d5'
    white:   '#a6adc8'
  cursor:
    text:   '#1e1e2e'
    cursor: '#cdd6f4'
  selection:
    text:       '#1e1e2e'
    background: '#cdd6f4'

cursor:
  style:
    shape: Block
    blinking: On
  vi_mode_style: Beam
  blink_interval: 500

live_config_reload: true
working_directory: None

shell:
  program: /bin/bash
  args:
    - --login

mouse:
  hide_when_typing: true
  url:
    launcher: xdg-open
    modifiers: Control

key_bindings:
  - { key: V, mods: Control|Shift, action: Paste }
  - { key: C, mods: Control|Shift, action: Copy }
  - { key: Q, mods: Control|Shift, action: Quit }
  - { key: N, mods: Control|Shift, action: SpawnNewInstance }
  - { key: PageUp,   mods: Shift, action: ScrollPageUp }
  - { key: PageDown, mods: Shift, action: ScrollPageDown }

env:
  TERM: xterm-256color
