# Pinned settings for qwen-build (measured 2026-11-07 on 2x GTX 1660 SUPER, flash attention + q8 KV):
#  - temperature 0.1: far fewer random variations and runaway loops than Ollama's default 0.8
#  - num_ctx 12288 (14b): stays 100% on the GPUs at ~17 tok/s; larger windows spill to the CPU (~7 tok/s)
#  - num_predict 4608: a whole-file answer never needs more; stops a runaway before Ollama's 10 minute limit
- name: ollama/qwen2.5-coder:14b
  edit_format: whole
  extra_params:
    temperature: 0.1
    num_ctx: 12288
    num_predict: 4608
- name: ollama/qwen2.5-coder:7b
  edit_format: whole
  extra_params:
    temperature: 0.1
    num_ctx: 16384
    num_predict: 4608
